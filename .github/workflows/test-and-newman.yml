name: Test & API Validation (PHPUnit + Newman)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DB_CONNECTION: sqlite
  DB_DATABASE: ":memory:"
  APP_ENV: testing
  APP_DEBUG: true

jobs:
  phpunit-tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fraca_inventory_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    strategy:
      matrix:
        php-version: [ '8.2' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, pdo, pdo_mysql, pdo_sqlite
        coverage: xdebug
        tools: composer:v2

    - name: Copy .env.example to .env.testing
      run: cp .env.example .env.testing

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Generate Laravel App Key
      run: php artisan key:generate --env=testing

    - name: Run PHP Linting
      run: find app tests -name "*.php" -exec php -l {} \;

    - name: Create SQLite test database
      run: touch database/testing.sqlite

    - name: Run Database Migrations (Testing)
      run: php artisan migrate --env=testing --database=sqlite

    - name: Seed Test Data
      run: php artisan db:seed --env=testing

    - name: Run PHPUnit Unit Tests
      run: vendor/bin/phpunit tests/Unit --coverage-text --coverage-clover=coverage.xml
      continue-on-error: false

    - name: Run PHPUnit Feature/Integration Tests
      run: vendor/bin/phpunit tests/Feature --coverage-text --coverage-clover=coverage.xml
      continue-on-error: false

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  postman-tests:
    name: Postman API Tests (Newman)
    runs-on: ubuntu-latest
    needs: phpunit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Newman globally
      run: npm install -g newman newman-reporter-htmlextra

    - name: Setup PHP for Laravel
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_sqlite
        tools: composer:v2

    - name: Copy .env.example to .env
      run: cp .env.example .env

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Generate Laravel App Key
      run: php artisan key:generate

    - name: Create SQLite database
      run: touch database/testing.sqlite

    - name: Run Database Migrations
      run: php artisan migrate --database=sqlite

    - name: Seed Test Data
      run: php artisan db:seed

    - name: Start Laravel Development Server
      run: php artisan serve --port=8000 &
      env:
        APP_ENV: testing

    - name: Wait for Laravel server to be ready
      run: sleep 5

    - name: Run Postman Collection with Newman
      run: |
        newman run postman/FRACA-SERVCOM-API.postman_collection.json \
          -e <(echo '{"values":[{"key":"base_url","value":"http://localhost:8000/api/v1"}]}') \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export "postman-test-results.html"
      continue-on-error: false

    - name: Upload Postman Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: postman-results
        path: postman-test-results.html

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [ phpunit-tests, postman-tests ]
    if: always()

    steps:
    - name: Check Test Results
      run: |
        echo "PHPUnit Tests: ${{ needs.phpunit-tests.result }}"
        echo "Postman Tests: ${{ needs.postman-tests.result }}"
        
        if [[ "${{ needs.phpunit-tests.result }}" == "failure" ]] || [[ "${{ needs.postman-tests.result }}" == "failure" ]]; then
          echo "Tests failed! Check logs for details."
          exit 1
        fi
        
        echo "✅ All tests passed successfully!"
